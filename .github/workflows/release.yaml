name: "Release"

permissions:
    contents: write
    actions: read
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Specify tag to create"
                required: true

jobs:
    create-signed-tag:
        name: Create Signed Tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Import GPG key and configure Git
              env:
                  GPG_NAME: ${{ secrets.GPG_NAME }}
                  GPG_EMAIL: ${{ secrets.GPG_EMAIL }}
              run: |
                  echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
                  echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
                  echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
                  gpg-connect-agent reloadagent /bye
                  KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
                  git config user.name "${GPG_NAME}"
                  git config user.email "${GPG_EMAIL}"
                  git config user.signingkey "$KEY_ID"
                  cat > "$RUNNER_TEMP/gpg-wrapper.sh" << 'EOF'
                  #!/usr/bin/env bash
                  exec gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"
                  EOF
                  chmod +x "$RUNNER_TEMP/gpg-wrapper.sh"
                  git config gpg.program "$RUNNER_TEMP/gpg-wrapper.sh"

            - name: Create signed tag
              env:
                  TAG: ${{ github.event.inputs.tag }}
                  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
              run: |
                  if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "Tag $TAG already exists, using it as-is."
                    echo "The build will check out $TAG ($(git rev-list -n1 "$TAG")) and update its release."
                    exit 0
                  fi
                  git tag -s "$TAG" -m "Release $TAG" HEAD
                  git push origin "refs/tags/$TAG"

    build:
        name: Build
        needs: create-signed-tag
        strategy:
            matrix:
                target:
                    - target: macos-arm
                      os: macos-latest
                      make: bash scripts/build-macos.sh aarch64
                      artifact_path: |
                          echo "ARTIFACT_PATH=target/release/flowsurface-aarch64-macos.tar.gz" >> "$GITHUB_ENV"
                    - target: macos-x64
                      os: macos-15-intel
                      make: bash scripts/build-macos.sh x86_64
                      artifact_path: |
                          echo "ARTIFACT_PATH=target/release/flowsurface-x86_64-macos.tar.gz" >> "$GITHUB_ENV"
                    - target: windows-x64
                      os: windows-latest
                      make: bash scripts/build-windows.sh x86_64
                      artifact_path: |
                          echo "ARTIFACT_PATH=target/release/flowsurface-x86_64-windows.zip" >> $env:GITHUB_ENV
                    - target: linux-x64
                      os: ubuntu-latest
                      make: bash scripts/package-linux.sh package x86_64
                      artifact_path: |
                          echo "ARTIFACT_PATH=$(bash scripts/package-linux.sh archive_path x86_64)" >> "$GITHUB_ENV"
                    - target: linux-arm
                      os: ubuntu-24.04-arm
                      make: bash scripts/package-linux.sh package aarch64
                      artifact_path: |
                          echo "ARTIFACT_PATH=$(bash scripts/package-linux.sh archive_path aarch64)" >> "$GITHUB_ENV"
        runs-on: ${{ matrix.target.os }}
        env:
            FLOWSURFACE_OFFICIAL_RELEASE: "true"
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: refs/tags/${{ github.event.inputs.tag }}

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              shell: bash
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  if [ -z "$channel" ]; then
                      echo "Failed to read toolchain channel from rust-toolchain.toml" >&2
                      exit 1
                  fi
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}

            - name: Install linux deps
              if: startsWith(matrix.target.target, 'linux')
              run: |
                  sudo apt update
                  sudo apt install -y \
                    build-essential \
                    git \
                    pkg-config \
                    libudev-dev \
                    libxkbcommon-dev \
                    libasound2-dev

            - name: Configure optimized release profile
              if: ${{ matrix.target.target != 'macos-x64' }}
              shell: bash
              run: |
                  if grep -q "\[profile.release\]" Cargo.toml; then
                    sed -i '/\[profile.release\]/,/^\[/s/^lto.*//g' Cargo.toml
                    sed -i '/\[profile.release\]/,/^\[/s/^codegen-units.*//g' Cargo.toml
                    sed -i '/\[profile.release\]/,/^\[/s/^opt-level.*//g' Cargo.toml
                    sed -i '/\[profile.release\]/a opt-level = 3\ncodegen-units = 1\nlto = "fat"' Cargo.toml
                  else
                    cat >> Cargo.toml << EOF

                  [profile.release]
                  lto = "fat"
                  codegen-units = 1
                  opt-level = 3
                  EOF
                  fi
                  rm -f .cargo/config.toml

            - name: Configure macOS x64 release profile (thin LTO)
              if: ${{ matrix.target.target == 'macos-x64' }}
              shell: bash
              run: |
                  if grep -q "\[profile.release\]" Cargo.toml; then
                    sed -i '/\[profile.release\]/,/^\[/s/^lto.*//g' Cargo.toml
                    sed -i '/\[profile.release\]/,/^\[/s/^codegen-units.*//g' Cargo.toml
                    sed -i '/\[profile.release\]/,/^\[/s/^opt-level.*//g' Cargo.toml
                    sed -i '/\[profile.release\]/a opt-level = 3\ncodegen-units = 1\nlto = "thin"' Cargo.toml
                  else
                    cat >> Cargo.toml << EOF

                  [profile.release]
                  lto = "thin"
                  codegen-units = 1
                  opt-level = 3
                  EOF
                  fi
                  rm -f .cargo/config.toml

            - name: Build
              run: ${{ matrix.target.make }}

            - name: Set artifact path
              run: ${{ matrix.target.artifact_path }}

            - name: Extract Windows artifact for signing
              if: matrix.target.target == 'windows-x64'
              shell: bash
              run: |
                  mkdir -p target/release/win-unsigned
                  unzip -o target/release/flowsurface-x86_64-windows.zip \
                    -d target/release/win-unsigned

            - name: Upload unsigned Windows files for SignPath
              if: matrix.target.target == 'windows-x64'
              id: upload-unsigned-windows
              uses: actions/upload-artifact@v7
              with:
                  name: windows-unsigned
                  path: target/release/win-unsigned

            - name: Submit SignPath signing request
              if: matrix.target.target == 'windows-x64'
              uses: signpath/github-action-submit-signing-request@v2
              with:
                  api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
                  organization-id: "${{ secrets.SIGNPATH_ORG_ID }}"
                  project-slug: "flowsurface"
                  signing-policy-slug: "release-signing"
                  github-artifact-id: "${{ steps.upload-unsigned-windows.outputs.artifact-id }}"
                  wait-for-completion: true
                  wait-for-completion-timeout-in-seconds: 1800
                  output-artifact-directory: "target/release/win-signed"

            - name: Repackage signed Windows artifact
              if: matrix.target.target == 'windows-x64'
              shell: pwsh
              run: |
                  Remove-Item target/release/flowsurface-x86_64-windows.zip -Force -ErrorAction SilentlyContinue
                  Compress-Archive -Path target/release/win-signed/* -DestinationPath target/release/flowsurface-x86_64-windows.zip -Force

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              env:
                  ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
              with:
                  name: ${{ matrix.target.target }}
                  path: ${{ env.ARTIFACT_PATH }}

    publish-release:
        name: Publish Release
        needs: [aggregate-artifacts]
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Download signed artifacts
              uses: actions/download-artifact@v8
              with:
                  name: signed-artifacts
                  path: release-artifacts

            - name: Generate checksums
              working-directory: release-artifacts
              run: |
                  sha256sum flowsurface-universal-macos.tar.gz | awk '{print $1 "  flowsurface-universal-macos.tar.gz"}' >> SHA256SUMS
                  sha256sum flowsurface-x86_64-windows.zip | awk '{print $1 "  flowsurface-x86_64-windows.zip"}' >> SHA256SUMS
                  sha256sum flowsurface-x86_64-linux.tar.gz | awk '{print $1 "  flowsurface-x86_64-linux.tar.gz"}' >> SHA256SUMS
                  sha256sum flowsurface-aarch64-linux.tar.gz | awk '{print $1 "  flowsurface-aarch64-linux.tar.gz"}' >> SHA256SUMS

                  cat SHA256SUMS

            - name: Import GPG key
              run: |
                  echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
                  echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
                  gpg-connect-agent reloadagent /bye

            - name: Sign checksums
              working-directory: release-artifacts
              env:
                  GPG_TTY: /dev/null
              run: |
                  if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
                    echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --armor --detach-sign SHA256SUMS
                  else
                    gpg --batch --yes --pinentry-mode loopback --armor --detach-sign SHA256SUMS
                  fi

            - name: Create or update release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  draft: true
                  overwrite_files: true
                  fail_on_unmatched_files: true
                  files: release-artifacts/*

    create-universal:
        name: Create Universal macOS Binary
        needs: build
        runs-on: macos-latest
        steps:
            - name: Download arm artifact
              uses: actions/download-artifact@v8
              with:
                  name: macos-arm
                  path: macos-arm

            - name: Download x64 artifact
              uses: actions/download-artifact@v8
              with:
                  name: macos-x64
                  path: macos-x64

            - name: Extract macOS arm artifact
              run: |
                  mkdir -p macos-arm/extracted
                  tar -xzf macos-arm/flowsurface-aarch64-macos.tar.gz -C macos-arm/extracted

            - name: Extract macOS x64 artifact
              run: |
                  mkdir -p macos-x64/extracted
                  tar -xzf macos-x64/flowsurface-x86_64-macos.tar.gz -C macos-x64/extracted

            - name: Create universal binary
              run: |
                  mkdir -p target/release
                  lipo macos-arm/extracted/flowsurface macos-x64/extracted/flowsurface -create -output target/release/flowsurface
                  tar -czf target/release/flowsurface-universal-macos.tar.gz -C target/release flowsurface

            - name: Upload universal artifact
              uses: actions/upload-artifact@v7
              with:
                  name: macos-universal
                  path: target/release/flowsurface-universal-macos.tar.gz

    aggregate-artifacts:
        name: Aggregate Release Artifacts
        needs: [build, create-universal]
        runs-on: ubuntu-latest
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: Collect artifacts
              shell: bash
              run: |
                  mkdir -p release-artifacts

                  cp artifacts/windows-x64/flowsurface-x86_64-windows.zip release-artifacts/

                  cp artifacts/macos-universal/flowsurface-universal-macos.tar.gz release-artifacts/

                  cp artifacts/linux-x64/flowsurface-x86_64-linux.tar.gz release-artifacts/

                  cp artifacts/linux-arm/flowsurface-aarch64-linux.tar.gz release-artifacts/

                  ls -la release-artifacts/

            - name: Upload collected artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: signed-artifacts
                  path: release-artifacts/
