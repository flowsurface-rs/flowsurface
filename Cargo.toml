[package]
name = "flowsurface"
version.workspace = true
readme = "README.md"
license = "GPL-3.0-or-later"
description = "A native desktop charting platform for crypto markets"
categories = ["finance", "visualization", "gui"]
edition.workspace = true
repository.workspace = true
homepage.workspace = true

[workspace.package]
version = "0.8.10"
edition = "2024"
repository = "https://github.com/flowsurface-rs/flowsurface"
homepage = "https://flowsurface.com"

[workspace]
members = [ "data", "exchange"]

[workspace.dependencies]
iced_core = { version = "0.15.0-dev", features = ["serde"] }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "now", "clock"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
thiserror = "2.0.18"
regex = "1.12.3"
palette = "0.7.6"
num-traits = "0.2.19"
rustc-hash = "2.1.2"
enum-map = "2.7.3"
url = "2.5.8"
rand = "0.10.1"
uuid = { version = "1.23.1", features = ["v4"] }
data = { version = "0.8.10", path = "data", package = "flowsurface-data" }
exchange = { version = "0.8.10", path = "exchange", package = "flowsurface-exchange" }
arrow-ipc = { version = "59.1", default-features = false }
arrow-array = { version = "59.1", default-features = false }
arrow-schema = { version = "59.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }

[dependencies]
iced = { version = "0.15.0-dev", default-features = false, features = [
    "wgpu",
    "tokio",
    "canvas",
    "sipper",
    "advanced",
    "unconditional-rendering",
    "crisp",
    "x11",
    "wayland",
] }
iced_core.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
uuid.workspace = true
palette.workspace = true
num-traits.workspace = true
rustc-hash.workspace = true
enum-map.workspace = true
url.workspace = true
fern = "0.7.1"
reqwest.workspace = true
rodio = { version = "0.22.2", default-features = false, features = [ "playback", "wav" ]}

bytemuck = "1.25.0"
iced_wgpu = { version = "0.15.0-dev", features = ["geometry"] }
exchange.workspace = true
arrow-ipc.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
bytes = "1.11.1"
data.workspace = true

[features]
debug = ["iced/hot"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"

[profile.packaging]
inherits = "release"
lto = "fat"
codegen-units = 1

[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced", rev = "da17d4d761670f15db5b665a6c37e2bfd2cff889" }
iced_core = { git = "https://github.com/iced-rs/iced", rev = "da17d4d761670f15db5b665a6c37e2bfd2cff889" }
iced_wgpu = { git = "https://github.com/iced-rs/iced", rev = "da17d4d761670f15db5b665a6c37e2bfd2cff889" }
